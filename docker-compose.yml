services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "51200:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-default_db}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DB_FAST_STARTUP: ${DB_FAST_STARTUP:-true}
      DATA_DIR: ${DATA_DIR:-/data}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FOUNDER_ADMIN_EMAIL: ${FOUNDER_ADMIN_EMAIL:-aram_grigoryan96@bk.ru}
      FOUNDER_ADMIN_PASSWORD: ${FOUNDER_ADMIN_PASSWORD:-}
      FOUNDER_ADMIN_FULL_NAME: ${FOUNDER_ADMIN_FULL_NAME:-Aram Grigoryan}
      APP_VERSION: ${APP_VERSION:-1.2.1}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      PASSWORD_RESET_CODE: ${PASSWORD_RESET_CODE:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-ru-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-reestrpro/}
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      BACKUP_TELEGRAM_BOT_TOKEN: ${BACKUP_TELEGRAM_BOT_TOKEN:-}
      BACKUP_TELEGRAM_CHAT_ID: ${BACKUP_TELEGRAM_CHAT_ID:-}
